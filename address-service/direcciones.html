    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $.ajax({
          url: "direcciones_usuario.php",
          dataType: "json",
          success: function (data) {
            var cardsContainer = $(".cards-container");
            data.forEach(function (item) {
              var card = $('<div class="card">');
              var cardContent = $('<div class="card-content">');

              var ciudad = $(
                '<p>Ciudad<br> <span style="color: #3c8735;">' +
                  item.ciudad +
                  "</span></p>"
              );
              var direccion = $(
                '<p>Direccion<br>  <span style="color: #3c8735;">' +
                  item.direccion +
                  "</span></p>"
              );
              var descripcion = $(
                '<p>Descripcion casa<br> <span style="color: #3c8735;">' +
                  item.descripcion +
                  "</span></p>"
              );

              var imagen = $('<img src="../statics/logo_casa.png" alt="Imagen">');
              
            // Agregamos los elementos a la tarjeta
              cardContent.append(imagen,ciudad, direccion, descripcion);
              card.append(cardContent);
              cardsContainer.append(card);
            });
          },
          error: function () {
            console.log("Error al obtener los datos.");
          },
        });
      });
    </script>
