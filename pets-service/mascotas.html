    <div class="cards-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $.ajax({
          url: "../pets-service/mascotas_usuario.php",
          dataType: "json",
          success: function (data) {
            var cardsContainer = $(".cards-container");
            data.forEach(function (item) {
              
              var card = $('<div class="card">');
              var cardContent = $('<div class="card-content">');

              var nombre_mascota = $(
                '<p>Nombre: <span style="color: #3c8735;">' +
                  item.nombre_mascota +
                  "</span></p>"
              );
              var edad = $(
                '<p>Edad:  <span style="color: #3c8735;">' +
                  item.anios +
                  " años " +
                  item.meses +
                  " meses</span></p>"
              );
              var raza = $(
                '<p>Raza: <span style="color: #3c8735;">' +
                  item.raza +
                  "</span></p>"
              );
              var genero = $(
                '<p>Genero: <span style="color: #3c8735;">' +
                  item.genero +
                  "</span></p>"
              );
              var tamaño = $(
                '<p>Tamaño: <span style="color: #3c8735;">' +
                  item.peso_mascota +
                  "</span></p>"
              );

              // Agregamos los elementos a la tarjeta
              cardContent.append(nombre_mascota, edad, raza, genero, tamaño);
              card.append(cardContent);
              cardsContainer.append(card);
            });
          },
          error: function () {
            console.log("Error al obtener los datos.");
          },
        });
      });
    </script>
